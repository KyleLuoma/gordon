<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe-Informed Shopping List Builder</title>
    <link rel="stylesheet" type="text/css" href="./css/sidenav.css">
    <link rel="stylesheet" type="text/css" href="./css/artifact_view.css">
    <link rel="stylesheet" type="text/css" href="./css/main.css">

    <script>
var artifactOpen = true;

/* Set the width of the side navigation to 250px */
function openNav() {
    document.getElementById("mySidenav").style.width = "250px";
    document.getElementById("main").style.marginLeft = "250px";
}

/* Set the width of the side navigation to 0 */
function closeNav() {
    document.getElementById("mySidenav").style.width = "0";
    document.getElementById("main").style.marginLeft = "0";
} 

function closeArtifact() {
    const artifactWindow = document.getElementById("myArtifactWindow");
    console.log("Closing artifact window")
    artifactWindow.style.width = "5%";
    document.getElementById("main").style.marginRight = "5%";
    artifactWindow.classList.add("closed");
    artifactOpen = false;
    setTimeout(() => {
        artifactWindow.onclick = (event) => {
            event.stopPropagation();
            openArtifact();
        };
    }, 1000);
}

function openArtifact() {
    const artifactWindow = document.getElementById("myArtifactWindow");
    if(artifactOpen){
        return;
    }
    console.log("Opening artifact window");
    artifactWindow.style.width = "50%";
    document.getElementById("main").style.marginRight = "50%";
    artifactWindow.classList.remove("closed");
    artifactOpen = true;
    artifactWindow.onclick = null;
}

    </script>



</head>
<body>
    <div id="mySidenav" class="sidenav">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Clients</a>
        <a href="#">Contact</a>
    </div>
      
    <!-- Use any element to open the sidenav -->
    <span class="nav-open-button" onclick="openNav()">Menu</span>
      
      <!-- Add all page content inside this div if you want the side nav to push page content to the right (not used if you only want the sidenav to sit on top of the page -->
    <div id="main" class="main-window">
        <h1>Gordon: Cooking and Shopping Assistance</h1>
        <p>Add recipes | generate shopping lists.</p>

        <div id="shopping-list-controls">
            <h3>List Controls</h3>
            <label for="user-name">User:</label>
            <input type="text" id="user-name" name="user_name" value="test" placeholder="Enter user name">

            <label for="list-name">New List Name:</label>
            <input type="text" id="list-name" name="list_name" value="Weekly Shopping" placeholder="Enter list name">
            <button type="button" onclick="createShoppingList()">Create List</button>

            <label for="shopping-list-select">Existing Lists:</label>
            <select id="shopping-list-select" name="shopping_list_select"></select>
            <button type="button" onclick="loadSelectedShoppingList()">Load Selected List</button>

            <button type="button" onclick="addSelectedRecipesToActiveList()">Add Selected Recipes To Active List</button>
            <button type="button" onclick="refreshActiveShoppingList()">Refresh Active Shopping List</button>

            <div id="list-status-message" class="status-message"></div>
            <input type="hidden" id="active-list-id" value="">
        </div>

        <div id="recipe-selector">
            <h3>Select Recipes</h3>
            <div 
                id="recipe-table-container" 
                hx-get="/get_user_recipes" 
                hx-vals='js:{user_name: getUserName()}' 
                hx-trigger="load, refresh" 
                hx-target="#recipe-table-container" 
                hx-swap="innerHTML"
                >
                <!-- The table will be dynamically populated by the /get_user_recipes endpoint -->
            </div>
        </div>
        <div id="shopping-list">
            <h3>Selected Recipe Ingredient Preview</h3>
            <div id="ingredient-list-container" 
                 hx-post="/get_recipe_ingredients" 
                 hx-vals='js:{user_name: getUserName(), recipe_ids: getSelectedRecipeIds()}' 
                 hx-trigger="refresh"
                 hx-swap="innerHTML">
                <!-- The ingredient list will be dynamically populated by the /get_recipe_ingredients endpoint -->
            </div>
        </div>

        <div id="shopping-list-live">
            <h3>Active Shopping List</h3>
            <div id="combined-shopping-list-container">
            </div>
        </div>

    </div> 

    <div id="myArtifactWindow" class="artifact_window" onclick="openArtifact()">
        <a href="javascript:void(0)" class="closebtn" onclick="event.stopPropagation(); closeArtifact()">&times;</a>
        
        <h3>Add an Online Recipe</h3>
        <div id="recipe-url-input">
            <form id="recipe-url-form"
            hx-post="/submit_recipe_url"
            hx-vals='js:{user_name: getUserName()}'
            hx-swap="none"
            hx-on::after-request="htmx.trigger('#recipe-table-container', 'refresh'); refreshShoppingLists(); setStatus('Recipe URL submitted.');"
            >
                <input type="text" id="recipe-url" name="recipe_url" placeholder="Recipe URL">
                <br>
                <button type="submit">Analyze Recipe Page</button>
            </form>
        </div>

        <h3>Upload a Recipe</h3>
        <div id="recpipe-text-input">
            <form id="recipe-text-form" 
            hx-post="/submit_recipe_text" 
            hx-vals='js:{user_name: getUserName()}' 
            hx-swap="none"
            hx-on::after-request="htmx.trigger('#recipe-table-container', 'refresh'); refreshShoppingLists(); setStatus('Recipe text submitted.');"
            >
                <textarea id="recipe-text" name="recipe_text" rows="10" cols="50" placeholder="Paste your recipe text here"></textarea>
                <br>
                <label for="recipe-name">Recipe Name:</label>
                <input type="text" id="recipe-name" name="recipe_name" placeholder="Enter recipe name">
                <br>
                <label for="recipe-source">Recipe Source:</label>
                <input type="text" id="recipe-source" name="recipe_source" placeholder="Enter recipe source">
                <br>
                <button type="submit">Submit Recipe</button>
            </form>
        </div>

        <div id="file-management">
            <div id="dropContainer" class="drop-container">
                Drop Here
            </div>
            <input type="file" id="fileInput" />
        </div>
        
        
        <div id="item-manager">
            <h3>Add Items</h3>
            <form id="add-item-form" >
            <div
                id="additional-item-form-elements"
                hx-get="/get_additional_item_selections"
                hx-vals='js:{user_name: getUserName()}'
                hx-trigger="load, refresh"
                hx-swap="innerHTML"
            >

            </div>
            <label for="item-name">Item Name:</label>
            <input type="text" id="item-name" name="item_name" placeholder="Enter item name">
            <br>
            <button type="submit"
                hx-post="/add_additional_item_to_list"
                hx-vals='js:{user_name: getUserName(), list_id: getActiveListId()}'
                hx-target="#combined-shopping-list-container"
                hx-trigger="click"
                hx-swap="innerHTML"
                hx-on::after-request="setStatus('Item added to active list.');"
            >Add Item</button>
            </form>
        </div>
    </div>      
    
    <script src="./js/htmx.min.js"></script>


<script>
        // https://stackoverflow.com/questions/8006715/drag-drop-files-into-standard-html-file-input
        // dragover and dragenter events need to have 'preventDefault' called
        // in order for the 'drop' event to register. 
        // See: https://developer.mozilla.org/en-US/docs/Web/Guide/HTML/Drag_operations#droptargets
        var dropContainer = document.getElementById("dropContainer");
    var fileInput = document.getElementById("fileInput");
        dropContainer.ondragover = dropContainer.ondragenter = function(evt) {
          evt.preventDefault();
        };
        
        dropContainer.ondrop = function(evt) {
          fileInput.files = evt.dataTransfer.files;
        
          // If you want to use some of the dropped files
          const dT = new DataTransfer();
          dT.items.add(evt.dataTransfer.files[0]);
        //   dT.items.add(evt.dataTransfer.files[3]);
          fileInput.files = dT.files;
        
          evt.preventDefault();
        };
</script>

<script>
document.addEventListener("DOMContentLoaded", () => {
    function handleRowSelection(event) {
        console.log("handleRowSelection");
        const row = event.target.closest("tr"); 
        if (row && row.id) {
            row.classList.toggle("selected");
            console.log(`Row ${row.id} selection toggled.`);
            console.log(getSelectedRecipeIds());
            htmx.trigger('#ingredient-list-container', 'refresh');
        }
    }

    
    document.body.addEventListener("click", (event) => {
        const recipeTable = document.getElementById("recipe-list-table");
        if (recipeTable && recipeTable.contains(event.target)) {
            handleRowSelection(event);
        }
    });

    document.body.addEventListener("htmx:afterSwap", (event) => {
        if (event.target.id === "recipe-table-container") {
            console.log("HTMX swap completed for recipe-table-container.");
        }
    });

    refreshShoppingLists();
});


function getSelectedRecipeIds() {
    const selectedRows = document.querySelectorAll("#recipe-list-table tr.selected");
    const selectedIds = Array.from(selectedRows).map(row => row.id.replace("recipe-", "").replace("-row", ""));
    return "[" + selectedIds.map(id => `${id}`).join(", ") + "]";
}

function getUserName() {
    const input = document.getElementById("user-name");
    const value = (input?.value || "").trim();
    return value || "test";
}

function getActiveListId() {
    return (document.getElementById("active-list-id")?.value || "").trim();
}

function setActiveListId(listId) {
    document.getElementById("active-list-id").value = listId ? String(listId) : "";
}

function setStatus(message, isError = false) {
    const status = document.getElementById("list-status-message");
    status.textContent = message;
    status.style.color = isError ? "#9b1c1c" : "#1f2a1f";
}

async function createShoppingList() {
    const listName = (document.getElementById("list-name")?.value || "").trim();
    if (!listName) {
        setStatus("Please provide a list name.", true);
        return;
    }

    const formData = new URLSearchParams();
    formData.append("user_name", getUserName());
    formData.append("list_name", listName);

    try {
        const response = await fetch("/make_new_shopping_list", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: formData.toString()
        });
        const payload = await response.json();
        if (!response.ok) {
            setStatus(payload.error || "Unable to create list.", true);
            return;
        }

        setActiveListId(payload.list_id);
        await refreshShoppingLists(payload.list_id);
        await refreshActiveShoppingList();
        setStatus(`Active list: ${payload.list_name} (#${payload.list_id})`);
    } catch (err) {
        setStatus("Failed to create shopping list.", true);
    }
}

async function refreshShoppingLists(preferredId = null) {
    const select = document.getElementById("shopping-list-select");
    try {
        const response = await fetch(`/get_user_shopping_lists?user_name=${encodeURIComponent(getUserName())}`);
        const payload = await response.json();
        if (!response.ok) {
            setStatus(payload.error || "Unable to load shopping lists.", true);
            return;
        }

        select.innerHTML = "";
        const lists = payload.lists || [];
        if (lists.length === 0) {
            const opt = document.createElement("option");
            opt.value = "";
            opt.textContent = "No shopping lists yet";
            select.appendChild(opt);
            setActiveListId("");
            return;
        }

        for (const list of lists) {
            const opt = document.createElement("option");
            opt.value = list.id;
            opt.textContent = `#${list.id} - ${list.name}`;
            select.appendChild(opt);
        }

        const desiredId = preferredId || getActiveListId() || lists[0].id;
        select.value = String(desiredId);
        setActiveListId(select.value);
    } catch (err) {
        setStatus("Failed to refresh shopping list selections.", true);
    }
}

async function loadSelectedShoppingList() {
    const listId = document.getElementById("shopping-list-select")?.value || "";
    if (!listId) {
        setStatus("Select a shopping list first.", true);
        return;
    }
    setActiveListId(listId);
    await refreshActiveShoppingList();
    setStatus(`Loaded shopping list #${listId}`);
}

async function refreshActiveShoppingList() {
    const listId = getActiveListId();
    if (!listId) {
        setStatus("No active list selected.", true);
        return;
    }

    const formData = new URLSearchParams();
    formData.append("user_name", getUserName());
    formData.append("list_id", listId);

    try {
        const response = await fetch("/get_combined_shopping_list_items", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: formData.toString()
        });
        const html = await response.text();
        document.getElementById("combined-shopping-list-container").innerHTML = html;
    } catch (err) {
        setStatus("Unable to refresh active shopping list.", true);
    }
}

async function addSelectedRecipesToActiveList() {
    const listId = getActiveListId();
    if (!listId) {
        setStatus("Create or load a shopping list first.", true);
        return;
    }

    const selected = getSelectedRecipeIds();
    if (selected === "[]") {
        setStatus("Select at least one recipe.", true);
        return;
    }

    const formData = new URLSearchParams();
    formData.append("user_name", getUserName());
    formData.append("list_id", listId);
    formData.append("recipe_ids", selected);

    try {
        const response = await fetch("/add_recipes_to_list", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: formData.toString()
        });
        const text = await response.text();
        if (!response.ok) {
            let errorMessage = "Unable to add selected recipes to list.";
            try {
                errorMessage = JSON.parse(text).error || errorMessage;
            } catch (err) {
                // Keep fallback message.
            }
            setStatus(errorMessage, true);
            return;
        }
        document.getElementById("combined-shopping-list-container").innerHTML = text;
        setStatus("Selected recipes added to active list.");
    } catch (err) {
        setStatus("Request failed while adding recipes.", true);
    }
}
</script>

</body>
</html>
